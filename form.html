<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2020 Proposal Form</title>
    <link rel="stylesheet" href="form.css" />
    <!-- allow html5 to run in older versions of IE -->
    <!--[if lt IE 9]>
        <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->
</head>

<body>

<div id="wrapper">
    <header>
        <h1>2020 Proposal Form</h1>
        <p>Please complete all required fields to submit your speaker proposal for the 2020 event.</p>
        <p><strong>Note:</strong> Fields marked with <span class="required">*</span> are required.</p>
    </header>

    <form action="" method="post" id="proposal2020" aria-labelledby="form-header">
        <fieldset>
            <legend>Speaker Information</legend>

            <div id="formcol1">
                <ul>
                    <li>
                        <label for="fstspkr1">First Name <span class="required">*</span>:</label>
                        <input id="fstspkr1" name="fstspkr1" type="text" class="reqfield" required aria-required="true" />
                    </li>

                    <li>
                        <label for="lstname1">Last Name <span class="required">*</span>:</label>
                        <input id="lstname1" name="lstname1" type="text" class="reqfield" required aria-required="true" />
                    </li>

                    <li>
                        <label for="spkrtitle1">Title:</label>
                        <input id="spkrtitle1" name="spkrtitle1" type="text" maxlength="48" />
                    </li>

                    <li>
                        <label for="company1">Company:</label>
                        <input id="company1" name="company1" type="text" />
                    </li>

                    <li>
                        <label for="department1">Department:</label>
                        <input id="department1" name="department1" type="text" />
                    </li>

                    <li>
                        <label for="address1">Address <span class="required">*</span>:</label>
                        <input id="address1" class="reqfield" name="address1" type="text" required aria-required="true" />
                    </li>
                </ul>
            </div> <!-- end of formcol1 div -->

        </fieldset>

        <fieldset>
            <legend>Type of Presentation</legend>

            <div id="multchoice">
                <p>
                    <label for="TypeofPres_lec">Lecture</label>
                    <input value="1" id="TypeofPres_lec" name="p-type" type="radio" aria-labelledby="TypeofPres_lec" />
                    <label for="TypeofPres_lab">Computer Lab</label>
                    <input value="2" id="TypeofPres_lab" name="p-type" type="radio" aria-labelledby="TypeofPres_lab" />
                </p>
            </div> <!-- end of multchoice div -->
        </fieldset>

        <p class="submit-button">
            <button type="submit">Submit your proposal</button>
        </p>

    </form>
</div> <!-- end wrapper div -->

</body>
</html>
